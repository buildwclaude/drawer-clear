name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "apk/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DrawerClear.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawerClear-apk
          path: DrawerClear.apk

      - name: Commit APK into the repository (apk/ folder)
        run: |
          mkdir -p apk
          cp DrawerClear.apk apk/DrawerClear.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/DrawerClear.apk
          git commit -m "ci: APK build ${{ github.run_number }} [skip ci]" || echo "No changes"
          git pull --rebase
          git push

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DrawerClear.apk \
            --prerelease \
            --title "Drawer Clear (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download DrawerClear.apk on your phone and install it over the previous version."
